apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-backend
  namespace: claude
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-backend
  template:
    metadata:
      labels:
        app: claude-backend
    spec:
      serviceAccountName: claude
      imagePullSecrets:
        - name: claude-zot-pull-secret
      containers:
        - name: claude-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          env:
            - name: CLAUDE_SERVICE_DB_PATH
              value: /data/claude-service.db
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: claude-data
