apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-prompt-runner
  namespace: claude
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: imac
          imagePullSecrets:
            - name: claude-zot-pull-secret
          containers:
            - name: prompt-runner
              image: "{{ .Values.promptRunner.image.repository }}:{{ .Values.promptRunner.image.tag }}"
              command: ["node", "src/index.js"]
              volumeMounts:
                - name: claude-config
                  mountPath: /root/.claude
                  readOnly: true
          volumes:
            - name: claude-config
              hostPath:
                path: /home/mattjmorrison/.claude
                type: Directory
