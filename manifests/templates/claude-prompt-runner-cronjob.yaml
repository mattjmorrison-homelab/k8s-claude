apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-prompt-runner
  namespace: claude
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: imac
          containers:
            - name: prompt-runner
              image: "{{ .Values.promptRunner.image.repository }}@{{ .Values.promptRunner.image.digest }}"
              command: ["/bin/sh", "/scripts/run-prompts.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: claude-config
                  mountPath: /root/.claude
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: claude-prompt-runner-script
                defaultMode: 0555
            - name: claude-config
              hostPath:
                path: /home/mattjmorrison/.claude
                type: Directory
