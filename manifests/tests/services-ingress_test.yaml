suite: Service and Ingress
templates:
  - backend-service.yaml
  - ingress.yaml
tests:
  - it: claude-backend Service targets port 8000
    template: backend-service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8000
      - equal:
          path: spec.ports[0].targetPort
          value: 8000
      - equal:
          path: spec.selector.app
          value: claude-backend

  - it: Ingress routes graph-claude.morrisons.site to claude-backend:8000
    template: ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].host
          value: graph-claude.morrisons.site
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: claude-backend
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8000

  - it: Ingress has exactly one host rule
    template: ingress.yaml
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
