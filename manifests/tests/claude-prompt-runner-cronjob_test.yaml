suite: claude-prompt-runner CronJob
templates:
  - claude-prompt-runner-cronjob.yaml
tests:
  - it: runs every 5 minutes
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"

  - it: forbids concurrent runs
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: uses the published prompt-runner image
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: registry.morrisons.site/claude-prompt-runner:2a4ad2f8d50dd0e9db6998bdcc9c207a0da8fb2f

  - it: runs the prompt-runner Node entrypoint
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["node", "src/index.js"]

  - it: pulls the image using the zot pull secret
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: claude-zot-pull-secret

  - it: pins to the imac node
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.nodeSelector
          value:
            kubernetes.io/hostname: imac

  - it: mounts the host's claude config read-only
    template: claude-prompt-runner-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].hostPath.path
          value: /home/mattjmorrison/.claude
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].hostPath.type
          value: Directory
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /root/.claude
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
