suite: SecretStore and ExternalSecret
tests:
  - it: claude-zot-pull-secret ExternalSecret pulls from the right remote key and renders a dockerconfigjson
    template: external-secret.yaml
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: homelab/service/k8s-zot/k8s-claude/zot-pull
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: spec.target.name
          value: claude-zot-pull-secret

  - it: SecretStore authenticates as the k8s-claude Kubernetes-auth role via the claude ServiceAccount
    template: secret-store.yaml
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: k8s-claude
      - equal:
          path: spec.provider.vault.auth.kubernetes.serviceAccountRef.name
          value: claude

  - it: is the only ExternalSecret the chart renders
    asserts:
      - hasDocuments:
          count: 1
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
