name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and push the test-stage image
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: claude-prompt-runner-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/k8s-claude.git#refs/heads/main
            --dockerfile=prompt-runner/Dockerfile --skip-unused-stages=true --target=test --destination=registry.morrisons.site/claude-prompt-runner-test:${{ github.sha }}
          secret-volume: claude-prompt-runner-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "1800"

      - name: Run tests inside the just-built test image
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: claude-prompt-runner-job
          image: registry.morrisons.site/claude-prompt-runner-test:${{ github.sha }}
          command: npm test

      - name: Build and push the release image
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: claude-prompt-runner-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: "false"
          command: >-
            --context=git://github.com/mattjmorrison-homelab/k8s-claude.git#refs/heads/main
            --dockerfile=prompt-runner/Dockerfile --skip-unused-stages=true --target=release
            --destination=registry.morrisons.site/claude-prompt-runner:${{ github.sha }}
          secret-volume: claude-prompt-runner-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "1800"
