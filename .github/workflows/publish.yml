name: Publish

on:
  pull_request:
    types: [closed]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Promote the PR's already-built image to the deployed tag
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: claude-prompt-runner-job
          image: gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
          shell: "false"
          command: >-
            tag registry.morrisons.site/claude-prompt-runner:pr-${{ github.event.pull_request.head.sha }}
            ${{ github.event.pull_request.head.sha }}
          env: DOCKER_CONFIG=/kaniko/.docker
          secret-volume: claude-prompt-runner-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "120"
