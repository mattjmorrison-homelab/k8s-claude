name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mattjmorrison-homelab/actions-helm@0e4a4ec223c1d0505715d38b2f4b060285082619
        with:
          namespace: claude
          service-account: claude-ci
          # No live dry-run yet -- the claude namespace doesn't exist
          # until this chart's own namespace.yaml first merges and syncs,
          # and claude-ci's token-issuer RoleBinding (k8s-ci-rbac) can't
          # sync into a namespace that doesn't exist either. Same
          # bootstrap deadlock k8s-ad-reporter's/k8s-backstage's/k8s-zot's
          # check.yml already document. helm lint still runs. Flip back
          # to the default (true) once this namespace/RBAC are confirmed
          # live.
          dry-run: "false"
